# Phase 02 — GPT-2 350M (DDP, 4 GPUs, single node)
# Inherits base_config.yaml via OmegaConf.merge at runtime.
# Values here override base_config.yaml where they differ.

# ── Model architecture ─────────────────────────────────────────────────────────
# GPT-2 350M: 24 layers, 16 heads, 1024-dim embeddings.
#   Token embeddings:  50257 × 1024 ≈  51.5M  (shared with lm_head)
#   Positional:         1024 × 1024 ≈   1.0M
#   Per block: attn (~4.2M) + mlp (~16.8M) + norms ≈ 21.1M × 24 layers ≈ 505M
#   Wait — n_embd=1024, so mlp is 1024→4096→1024 = 2×(1024×4096) ≈ 8.4M per block.
#   Per block: attn (3×1024²+1024²=4×1024²≈4.2M) + mlp (2×1024×4096≈8.4M) ≈ 12.6M × 24 ≈ 302M
#   Final LayerNorm + lm_head (tied):                                          ≈   0.1M
#   Total ≈ 354M parameters  (advertised as "350M")
n_layer: 24
n_head: 16
n_embd: 1024
dropout: 0.1

# ── Training ──────────────────────────────────────────────────────────────────
# batch_size is PER GPU. With 4 GPUs: effective batch = 4 × 4 = 16 sequences/step.
# Memory budget per rank (conservative — covers both A100-40GB and 24GB nodes):
#   Weights (fp32):   354M × 4B ≈ 1.4 GB
#   Gradients (fp32): same     ≈ 1.4 GB
#   AdamW state (m+v): 2×1.4   ≈ 2.8 GB
#   Activations (fp16, bs=4, seq=1024, 24L): ~5 GB (attention: 4×16×1024²×2×24 ≈ 3 GB)
#   NCCL DDP buffers:           ≈ 0.5 GB
#   Total: ~11 GB  →  fits on 24 GB GPUs with headroom.
# NOTE: bs=8 (effective 32) OOM'd on 24 GB nodes. bs=4 (effective 16) matches
# Phase 1's effective batch exactly, keeping LR scaling consistent.
batch_size: 4

# base learning rate (before linear scaling in train_ddp.py).
# train_ddp.py applies: effective_lr = learning_rate × world_size
# With world_size=4: effective_lr = 3e-4 × 4 = 1.2e-3
learning_rate: 3.0e-4

grad_clip: 1.0          # clip before optimizer step; norm logged separately

# Warmup: 2000 steps matches Phase 1. A 350M model could benefit from longer
# warmup (~10k steps) in production, but 2000 keeps Phase 2 comparable to
# the Phase 1 baseline for the acceptance criterion check.
warmup_steps: 2000

# torch.compile requires GCC >= 4.9 (stdatomic.h). Amarel has GCC 4.8.5.
use_compile: false

# ── Logging ───────────────────────────────────────────────────────────────────
grad_norm_log_interval: 100   # log gradient norm every N steps

# ── Data ──────────────────────────────────────────────────────────────────────
data_path: ???          # set at runtime via --data_path or $SCRATCH env
