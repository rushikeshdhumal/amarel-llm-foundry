# Set paths to exported checkpoint dirs (each must contain model.pt + config.yaml).
# $SCRATCH is expanded at runtime.

checkpoints:
  # Phase 1: no best/ dir on this run — using the lowest-loss step_* checkpoint.
  - name: phase1_124M
    path: /scratch/$USER/checkpoints/run_20260619_182306/step_0093000

  - name: phase2_350M
    path: /scratch/$USER/checkpoints/run_20260628_022929/best

  # Phase 3 training complete (step 42312, loss 0.5811) — export before use:
  #   sbatch slurm/export_checkpoint.sh --checkpoint $SCRATCH/checkpoints/run_20260722_182718/best
  - name: phase3_1B
    path: /scratch/$USER/checkpoints/run_20260722_182718/best_export
